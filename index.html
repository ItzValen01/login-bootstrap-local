<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

    <div class="container d-flex justify-content-center aling-items-center vh-100">
        <div class="card p-4 w-100 mb-3 mt-3">
            <h3 class="text-center mb-3 mt-3">Iniciar Sesión</h3>

            <input type="email" class="form-control mb-3 mt-3" placeholder="Email" name="email" id="email">

            <input type="password" class="form-control mb-3 mt-3" placeholder="Contraseña" name="password" id="password">

            <button class="btn btn-primary w-100 mb-3 mt-3">Ingresar</button>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
